<!DOCTYPE html>
<html>

<head>

<title>Hover Effect</title>

<style>

body{

background:#eee;

font-family:Arial;

display:flex;

justify-content:center;

margin-top:60px;

}

.card{

width:250px;

background:white;

padding:20px;

border-radius:10px;

text-align:center;

box-shadow:0 5px 10px gray;

transition:0.4s;

}

.card:hover{

transform:translateY(-10px) scale(1.05);

box-shadow:0 10px 25px black;

}

img{

width:180px;

}

button{

padding:10px 20px;

background:#0077cc;

color:white;

border:none;

cursor:pointer;

}

button:hover{

background:#005fa3;

}

</style>

</head>

<body>

<div class="card">

<img src="https://via.placeholder.com/180">

<h2>Wireless Headphones</h2>

<p>$99</p>

<button>Buy Now</button>

</div>

</body>

</html>
