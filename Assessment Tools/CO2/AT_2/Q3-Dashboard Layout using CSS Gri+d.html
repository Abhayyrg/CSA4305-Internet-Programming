<!DOCTYPE html>
<html>

<head>

<title>Dashboard</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

.container{

display:grid;

grid-template-columns:220px 1fr;

grid-template-rows:70px 1fr 60px;

height:100vh;

}

header{

grid-column:1/3;

background:#0077cc;

color:white;

display:flex;

justify-content:center;

align-items:center;

}

aside{

background:#333;

color:white;

padding:20px;

}

main{

background:#eee;

padding:20px;

}

footer{

grid-column:1/3;

background:#222;

color:white;

display:flex;

justify-content:center;

align-items:center;

}

</style>

</head>

<body>

<div class="container">

<header>Dashboard Header</header>

<aside>

<h3>Menu</h3>

<p>Home</p>

<p>Reports</p>

<p>Settings</p>

</aside>

<main>

<h2>Dashboard Content</h2>

<p>Statistics and charts appear here.</p>

</main>

<footer>Footer</footer>

</div>

</body>

</html>
