<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{

font-family:Arial;

margin:0;

}

.container{

display:flex;

flex-direction:column;

padding:20px;

gap:20px;

}

.content{

background:#f5f5f5;

padding:20px;

}

.sidebar{

background:#ddd;

padding:20px;

}

@media(min-width:768px){

.container{

flex-direction:row;

}

.content{

flex:3;

}

.sidebar{

flex:1;

}

}

</style>

</head>

<body>

<div class="container">

<div class="content">

<h2>Blog Title</h2>

<p>This is the main blog content.</p>

</div>

<div class="sidebar">

<h3>Recent Posts</h3>

<p>Post 1</p>

<p>Post 2</p>

</div>

</div>

</body>

</html>
