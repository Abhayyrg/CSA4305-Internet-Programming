<!DOCTYPE html>
<html>
<head>
    <title>Book Flight</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h2>?? Passenger Details</h2>

        <input type="text"
               id="passenger"
               placeholder="Passenger Name">

        <input type="number"
               id="age"
               placeholder="Age">

        <select id="gender">
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <input type="text"
               placeholder="Passport / ID Number">

        <h3>Select Seat</h3>

        <select id="seat">
            <option>1A</option>
            <option>1B</option>
            <option>2A</option>
            <option>2B</option>
            <option>3A</option>
            <option>3B</option>
        </select>

        <button onclick="continuePayment()">
            Continue to Payment
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
