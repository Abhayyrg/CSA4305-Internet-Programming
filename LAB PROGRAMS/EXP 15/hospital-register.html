<!DOCTYPE html>
<html>

<head>
    <title>Hospital Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="form-card">

        <h2>?? Hospital Registration</h2>

        <input type="text"
               id="hospitalName"
               placeholder="Hospital Name">

        <input type="text"
               id="hospitalLocation"
               placeholder="Location">

        <input type="tel"
               id="hospitalPhone"
               placeholder="Contact Number">

        <input type="email"
               id="hospitalEmail"
               placeholder="Email">

        <button onclick="registerHospital()">
            Register Hospital
        </button>

        <p id="hospitalMessage"></p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
