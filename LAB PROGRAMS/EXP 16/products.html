<!DOCTYPE html>
<html>

<head>
    <title>Products - TechSavvy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h2>? TechSavvy</h2>

    <nav>
        <a href="index.html">Home</a>
        <a href="cart.html">?? Cart</a>
        <a href="orders.html">Orders</a>
    </nav>

</header>

<div class="container">

    <h1>All Products</h1>

    <div class="filters">

        <input type="text"
               id="search"
               placeholder="Search products..."
               onkeyup="searchProducts()">

        <select id="category"
                onchange="filterProducts()">

            <option value="all">
                All Categories
            </option>

            <option value="phone">
                Smartphones
            </option>

            <option value="laptop">
                Laptops
            </option>

            <option value="tablet">
                Tablets
            </option>

            <option value="accessory">
                Accessories
            </option>

        </select>

    </div>


    <div class="products">


        <div class="product"
             data-category="phone">

            <div class="product-icon">
                ??
            </div>

            <h3>Galaxy Pro</h3>

            <p>Smartphone</p>

            <h3>?55,000</h3>

            <p class="available">
                ? In Stock
            </p>

            <button onclick="addToCart(
                'Galaxy Pro',55000)">
                Add to Cart
            </button>

        </div>


        <div class="product"
             data-category="laptop">

            <div class="product-icon">
                ??
            </div>

            <h3>TechBook X</h3>

            <p>Laptop</p>

            <h3>?75,000</h3>

            <p class="available">
                ? In Stock
            </p>

            <button onclick="addToCart(
                'TechBook X',75000)">
                Add to Cart
            </button>

        </div>


        <div class="product"
             data-category="tablet">

            <div class="product-icon">
                ??
            </div>

            <h3>Tab Ultra</h3>

            <p>Tablet</p>

            <h3>?35,000</h3>

            <p class="available">
                ? In Stock
            </p>

            <button onclick="addToCart(
                'Tab Ultra',35000)">
                Add to Cart
            </button>

        </div>


        <div class="product"
             data-category="accessory">

            <div class="product-icon">
                ??
            </div>

            <h3>AirSound</h3>

            <p>Wireless Headphones</p>

            <h3>?3,500</h3>

            <p class="available">
                ? In Stock
            </p>

            <button onclick="addToCart(
                'AirSound',3500)">
                Add to Cart
            </button>

        </div>


        <div class="product"
             data-category="accessory">

            <div class="product-icon">
                ??
            </div>

            <h3>Pro Keyboard</h3>

            <p>Mechanical Keyboard</p>

            <h3>?2,500</h3>

            <p class="available">
                ? In Stock
            </p>

            <button onclick="addToCart(
                'Pro Keyboard',2500)">
                Add to Cart
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
