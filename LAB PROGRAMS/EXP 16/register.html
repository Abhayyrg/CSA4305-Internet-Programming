<!DOCTYPE html>
<html>

<head>
    <title>Register - TechSavvy</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="form-card">

        <h1>? TechSavvy</h1>

        <h2>Create Account</h2>

        <input type="text"
               id="name"
               placeholder="Full Name">

        <input type="email"
               id="email"
               placeholder="Email">

        <input type="text"
               id="username"
               placeholder="Username">

        <input type="password"
               id="password"
               placeholder="Password">

        <button onclick="register()">
            Register
        </button>

        <p id="registerMessage"></p>

        <p>
            Already registered?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
