<!DOCTYPE html>
<html>

<head>
    <title>Checkout - StyleHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="form-card">

        <h2>?? Checkout</h2>

        <input type="text"
               id="address"
               placeholder="Delivery Address">

        <input type="text"
               id="city"
               placeholder="City">

        <input type="text"
               id="pincode"
               placeholder="PIN Code">

        <input type="tel"
               id="phone"
               placeholder="Phone Number">

        <select id="payment">

            <option>
                UPI
            </option>

            <option>
                Credit / Debit Card
            </option>

            <option>
                Cash on Delivery
            </option>

        </select>

        <button onclick="placeOrder()">
            Place Order
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
