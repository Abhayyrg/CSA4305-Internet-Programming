<!DOCTYPE html>
<html>

<head>
    <title>Login - StyleHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="form-card">

        <h1>?? StyleHub</h1>

        <h2>Login</h2>

        <input type="text"
               id="loginUsername"
               placeholder="Username">

        <input type="password"
               id="loginPassword"
               placeholder="Password">

        <button onclick="login()">
            Login
        </button>

        <p id="loginMessage"></p>

        <p>
            New customer?
            <a href="register.html">Create Account</a>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
