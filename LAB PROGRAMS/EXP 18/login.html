<!DOCTYPE html>
<html>

<head>
    <title>Login - HomeFinder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="form-card">

        <h1>?? HomeFinder</h1>

        <h2>Buyer Login</h2>

        <input
            type="text"
            id="loginUsername"
            placeholder="Username">

        <input
            type="password"
            id="loginPassword"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>

        <p id="loginMessage"></p>

        <p>
            New buyer?
            <a href="register.html">
                Create Account
            </a>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
