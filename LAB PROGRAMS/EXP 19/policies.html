<!DOCTYPE html>
<html>

<head>

    <title>Insurance Policies</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <h2>??? InsureEasy</h2>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="user.html">
            Dashboard
        </a>

    </nav>

</header>


<div class="container">

    <h1>Insurance Policies</h1>


    <div class="search-box">

        <input
            type="text"
            id="policySearch"
            placeholder="Search policy..."
            onkeyup="searchPolicies()">


        <select
            id="policyType"
            onchange="filterPolicies()">

            <option value="all">
                All Policies
            </option>

            <option value="health">
                Health
            </option>

            <option value="auto">
                Auto
            </option>

            <option value="home">
                Home
            </option>

        </select>

    </div>


    <div class="cards">


        <div
            class="card policy"
            data-type="health">

            <div class="icon">
                ??
            </div>

            <h2>
                Health Secure
            </h2>

            <p>
                Medical coverage for
                individuals and families.
            </p>

            <h3>
                ?12,000 / Year
            </h3>

            <button
                onclick="applyPolicy(
                'Health Secure')">

                Apply Now

            </button>

        </div>


        <div
            class="card policy"
            data-type="auto">

            <div class="icon">
                ??
            </div>

            <h2>
                Auto Protect
            </h2>

            <p>
                Complete vehicle protection
                against accidents.
            </p>

            <h3>
                ?8,500 / Year
            </h3>

            <button
                onclick="applyPolicy(
                'Auto Protect')">

                Apply Now

            </button>

        </div>


        <div
            class="card policy"
            data-type="home">

            <div class="icon">
                ??
            </div>

            <h2>
                Home Shield
            </h2>

            <p>
                Protection for your home
                and belongings.
            </p>

            <h3>
                ?15,000 / Year
            </h3>

            <button
                onclick="applyPolicy(
                'Home Shield')">

                Apply Now

            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
