<!DOCTYPE html>
<html>

<head>

    <title>Agent Registration</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <div class="form-card">

        <h1>??? InsureEasy</h1>

        <h2>Agent Registration</h2>

        <input
            type="text"
            id="agentName"
            placeholder="Full Name">

        <input
            type="email"
            id="agentEmail"
            placeholder="Email">

        <input
            type="text"
            id="agentPhone"
            placeholder="Phone Number">

        <input
            type="text"
            id="agentUsername"
            placeholder="Username">

        <input
            type="password"
            id="agentPassword"
            placeholder="Password">

        <button onclick="registerAgent()">
            Register
        </button>

        <p id="registerMessage"></p>

        <p>
            Already registered?
            <a href="login.html">
                Login
            </a>
        </p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
