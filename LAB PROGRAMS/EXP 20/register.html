<!DOCTYPE html>
<html>
<head>
    <title>Register - BlossomGifts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-card">

    <h1>?? BlossomGifts</h1>

    <h2>Create Account</h2>

    <input
        type="text"
        id="name"
        placeholder="Full Name">

    <input
        type="email"
        id="email"
        placeholder="Email">

    <input
        type="text"
        id="phone"
        placeholder="Phone Number">

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button onclick="register()">
        Register
    </button>

    <p id="registerMsg"></p>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
